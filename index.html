<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習策略互動學習單</title>
  <meta name="description" content="平和國中特殊需求課程 - 學習策略領域二十週互動式學習單系統">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar-nav">
      <div class="sidebar-header">
        <h1>
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          學習策略互動學習單
        </h1>
      </div>
      
      <!-- Semester Progress Bar -->
      <div class="progress-panel">
        <div class="progress-info">
          <span>全學期學習進度</span>
          <span id="global-progress-percent">0%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="global-progress-bar"></div>
        </div>
      </div>
      
      <!-- Dynamic Sidebar Menu List -->
      <nav class="sidebar-menu" id="sidebar-menu-list">
        <!-- Injected by app.js -->
      </nav>
      
      <!-- Sidebar Footer Tools -->
      <div class="sidebar-footer">
        <button class="home-btn" id="home-btn" title="回首頁儀表板">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: bold;">平和國中 資源班</span>
        <button class="theme-toggle" id="theme-toggle" title="切換深/淺色模式">
          <!-- Injected by app.js -->
        </button>
      </div>
    </aside>
    
    <!-- Main Content Area -->
    <main class="main-content" id="main-scroll-content">
      
      <!-- Top Sticky Navigation (Only visible on worksheet pages) -->
      <header class="top-nav" id="top-nav" style="display: none;">
        <div class="top-nav-title">
          <h2 id="nav-week-title">載入中...</h2>
        </div>
        <div class="top-nav-actions">
          <button class="btn" id="nav-btn-reset" title="重設本週資料">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path>
            </svg>
            重設本週
          </button>
          <button class="btn" id="nav-btn-print" title="列印或匯出成 PDF">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            列印 / PDF
          </button>
          <button class="btn btn-primary" id="nav-btn-submit" title="將本週作答送出至試算表" style="background-color: #10b981; border: none; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 2 11 13 22 2"></polyline><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            送出學習單
          </button>
        </div>
      </header>
      
      <!-- View A: Dashboard Home -->
      <section class="dashboard-home" id="dashboard-view">
        <div class="dashboard-hero">
          <div class="dashboard-hero-info">
            <h2>學習策略 互動學習單系統</h2>
            <p>歡迎來到學習策略課程！在這裡，你可以直接在線上完成每週的環境規劃、記憶練習及組織圖表。你的作答進度將會自動儲存。</p>
            <button class="btn btn-primary" id="hero-start-btn" style="margin-top: 20px; padding: 12px 24px; font-size: 1rem; border-radius: 30px;">
              開始第一課：我的學習避風港
            </button>
          </div>
        </div>
        
        <div class="dashboard-stats">
          <div class="stat-card">
            <span class="stat-title">全學期總進度</span>
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <span class="stat-value" id="dash-progress-percent">0%</span>
              <span class="stat-desc" id="dash-completed-weeks">0 / 20 週已完成</span>
            </div>
            <div class="progress-bar-container" style="margin-top: 14px; height: 10px;">
              <div class="progress-bar" id="dash-progress-bar" style="width: 0%;"></div>
            </div>
          </div>
          <div class="stat-card" style="justify-content: center;">
            <span class="stat-title">使用提示</span>
            <p style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5;">
              ✏️ 畫布區支援<b>滑鼠與平板觸控</b>作畫，完成後可下載圖檔。<br>
              💾 網頁具備<b>自動存檔</b>功能，隨時關閉都不用擔心。
            </p>
          </div>
        </div>
        
        <!-- Header with Teacher Settings button -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="font-size: 1.25rem; font-weight: 700; margin: 0;">單元大綱與快速連結</h3>
          <button class="btn" id="btn-teacher-settings" title="教師後台設定">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            教師設定
          </button>
        </div>
        
        <div class="units-grid" id="units-stats-grid">
          <!-- Injected by app.js -->
        </div>
      </section>
      
      <!-- View B: Worksheet Form Display -->
      <section class="worksheet-page" id="worksheet-view" style="display: none;">
        <div id="worksheet-container">
          <!-- Dynamically filled by app.js -->
        </div>
      </section>
      
    </main>
    
  </div>

  <!-- Teacher Settings Modal -->
  <div class="modal-overlay" id="settings-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>教師後台設定</h3>
        <button class="modal-close-btn" id="settings-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.5;">
          在此貼上您的 <b>Google Apps Script 網頁應用程式網址</b>。設定成功後，學生在學習單上點選「送出學習單」時，作答資料會自動寫入您的 Google 試算表。
        </p>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="font-size: 0.8rem; font-weight: bold; color: var(--text-secondary);">Google Apps Script Web App URL:</label>
          <input type="text" id="teacher-script-url" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="settings-cancel-btn">取消</button>
        <button class="btn btn-primary" id="settings-save-btn">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
